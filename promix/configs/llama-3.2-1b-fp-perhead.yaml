# ProMix Stage 1b: Llama-3.2-1B FP (MXFP8 high + NVFP4 main), ORIGINAL per-head o_proj
#
# Purpose: FP-format baseline that mirrors Stage 1a (INT W4A4) as closely as
# possible so PPL is directly comparable. Differences from
# llama-3.2-1b-mxfp8-nvfp4.yaml:
#   - o_proj_pca: per_head  (original ResQ path; avoids the unfixed
#     full_global activation-side online-rotation gap)
#   - model: -Instruct + nsamples 512  (match Stage 1a exactly)

model:
  name: "unsloth/Llama-3.2-1B-Instruct"
  type: "llama"

quantize:
  w_bits: "nvfp4"        # main weight path = NVFP4 (block-scaled fake quant)
  a_bits: "nvfp4"        # main activation path = NVFP4 (low/main channels)
  high_bits: "mxfp8"     # high-variance channel path = MXFP8
  low_bits: 2            # ignored under FP routing; kept for schema compat
  high_fraction: 0.125
  low_fraction: 0.0
  a_asym: true
  w_asym: false
  k_bits: 16
  v_bits: 16
  k_asym: true
  v_asym: true
  k_groupsize: 64
  v_groupsize: 64
  w_groupsize: -1
  w_clip: true
  percdamp: 0.01
  act_order: false
  sparse_fraction: 0.0
  down_proj_blocksize: 256
  rotate_mode: "resq"
  rotation_granularity: "full_shared"
  o_proj_pca: "per_head"   # original ResQ per-head o_proj (Stage 1b)

paths:
  basis: "./rotation/U-wikitext-512-fp-perhead-Llama-3.2-1B-Instruct.bin"
  rotation: "./rotation/R-fp-perhead-high-0.125-low-0.0-sparse-0.0-Llama-3.2-1B-Instruct.bin"
  output_dir: "/tmp/promix_ptq_1b_fp_perhead"

calibration:
  dataset: "wikitext"
  nsamples: 512
  seqlen: 2048
  seed: 0

eval:
  tasks:
    - piqa
    - arc_easy
    - arc_challenge
    - hellaswag
    - winogrande
    - boolq
    - openbookqa
  batch_size: 16
  num_fewshot: 0
  max_length: 2048
