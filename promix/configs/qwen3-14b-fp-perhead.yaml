# ProMix FP per-head (NVFP4+MXFP8), Qwen3-14B — rd-qwenmid ladder point (8B..70B).
# Mirrors qwen3-8b-fp-perhead.yaml. Qwen3-14B: hidden_size=5120 (high=640 % 32 OK;
# main=4480 % 16 OK); intermediate_size=17408 = 68 x 256 (down_proj online
# Hadamard = had68, Paley I q=67); 40 attention heads x 128 head_dim = 5120 =
# hidden (head_dim==hidden//heads holds); 8 KV heads; qk-norm present
# (orthogonal to R1/R2, see models/qwen.py); tie_word_embeddings=false.
# Ring512 substrate: 5120 % 512 = 0, 17408 % 512 = 0 (34 rings).
model:
  name: "Qwen/Qwen3-14B"
  type: "qwen3"

quantize:
  w_bits: "nvfp4"
  a_bits: "nvfp4"
  high_bits: "mxfp8"
  low_bits: 2
  high_fraction: 0.125
  low_fraction: 0.0
  a_asym: true
  w_asym: false
  k_bits: 16
  v_bits: 16
  k_asym: true
  v_asym: true
  k_groupsize: 128
  v_groupsize: 128
  w_groupsize: -1
  w_clip: true
  percdamp: 0.01
  act_order: false
  sparse_fraction: 0.0
  down_proj_blocksize: 256
  rotate_mode: "resq"
  rotation_granularity: "full_shared"
  o_proj_pca: "per_head"

paths:
  basis: "./rotation/U-wikitext-512-Qwen3-14B.bin"
  rotation: "./rotation/R-high-0.125-low-0.0-sparse-0.0-Qwen3-14B.bin"
  output_dir: "/tmp/promix_fp_perhead_qwen3_14b"

calibration:
  dataset: "wikitext"
  nsamples: 128
  seqlen: 2048
  seed: 0

eval:
  tasks: []
  batch_size: 8
  num_fewshot: 0
  max_length: 2048
