# ProMix FP per-head (NVFP4+MXFP8), Qwen3-8B — cross-family validation config.
# Mirrors llama-3-8b-fp-perhead.yaml. Qwen3-8B: hidden_size=4096 (high=512 % 32 OK;
# main=3584 % 16 OK); intermediate_size=12288 = 12 x 1024 (down_proj online
# Hadamard = had12); 32 attention heads x 128 head_dim = 4096; 8 KV heads;
# head_dim==hidden//heads holds (required, see models/qwen.py); qk-norm present
# (orthogonal to R1/R2, see models/qwen.py); tie_word_embeddings=false.
model:
  name: "Qwen/Qwen3-8B"
  type: "qwen3"

quantize:
  w_bits: "nvfp4"
  a_bits: "nvfp4"
  high_bits: "mxfp8"
  low_bits: 2
  high_fraction: 0.125
  low_fraction: 0.0
  a_asym: true
  w_asym: false
  k_bits: 16
  v_bits: 16
  k_asym: true
  v_asym: true
  k_groupsize: 128
  v_groupsize: 128
  w_groupsize: -1
  w_clip: true
  percdamp: 0.01
  act_order: false
  sparse_fraction: 0.0
  down_proj_blocksize: 256
  rotate_mode: "resq"
  rotation_granularity: "full_shared"
  o_proj_pca: "per_head"

paths:
  basis: "./rotation/U-wikitext-512-Qwen3-8B.bin"
  rotation: "./rotation/R-high-0.125-low-0.0-sparse-0.0-Qwen3-8B.bin"
  output_dir: "/tmp/promix_fp_perhead_qwen3_8b"

calibration:
  dataset: "wikitext"
  nsamples: 128
  seqlen: 2048
  seed: 0

eval:
  tasks: []
  batch_size: 16
  num_fewshot: 0
  max_length: 2048
