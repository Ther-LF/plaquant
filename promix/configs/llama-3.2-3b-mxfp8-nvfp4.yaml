# ProMix Quantization Config: Llama-3.2-3B W4A4 mixed MXFP8 (high) + NVFP4 (main)
#
# 3B Llama hidden_size=3072 (high=384 % 32 ✓; main=2688 % 16 ✓);
# intermediate_size=8192 (down_proj high=1024 % 32 ✓; main=7168 % 16 ✓).

model:
  name: "unsloth/Llama-3.2-3B"
  type: "llama"

quantize:
  w_bits: "nvfp4"
  a_bits: "nvfp4"
  high_bits: "mxfp8"
  low_bits: 2
  high_fraction: 0.125
  low_fraction: 0.0
  a_asym: true
  w_asym: false
  k_bits: 16
  v_bits: 16
  k_asym: true
  v_asym: true
  k_groupsize: 128
  v_groupsize: 128
  w_groupsize: -1
  w_clip: true
  percdamp: 0.01
  act_order: false
  sparse_fraction: 0.0
  down_proj_blocksize: 256
  rotate_mode: "resq"
  rotation_granularity: "full_shared"
  o_proj_pca: "full_global"

paths:
  basis: "./rotation/U-wikitext-512-mxfp8nvfp4-Llama-3.2-3B.bin"
  rotation: "./rotation/R-mxfp8nvfp4-high-0.125-low-0.0-sparse-0.0-Llama-3.2-3B.bin"
  output_dir: "/tmp/promix_ptq_3b_mxfp8_nvfp4"

calibration:
  dataset: "wikitext"
  nsamples: 128
  seqlen: 2048
  seed: 0

eval:
  tasks: []
  batch_size: 16
  num_fewshot: 0
  max_length: 2048

# Rate-distortion mixed-precision allocation (opt-in; plan Task 6).
# enabled: false => NO per-Linear K_high override is installed and the pipeline
# is BYTE-IDENTICAL to the shipped uniform high_fraction=0.125 split (zero
# regression). When enabled, `promix.quantize.adaptive.rd_alloc_config` reads
# this block: `mode` picks the operating point (perf|accuracy|knee), `target` is
# the avg-FP8 ring budget (perf) or acceptable PPL (accuracy/knee), `ring_size`
# is the allocation unit (64). The measured-MSE allocation is produced offline
# and driven into `configure_quantizers` via `model._rd_khigh_override`.
rd_alloc:
  enabled: false
  ring_size: 64
  mode: "perf"
  target: 0.125
