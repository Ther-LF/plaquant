# ProMix Quantization Config: Llama-2-13B W4A4 mixed MXFP8 (high) + NVFP4 (main)
#
# Llama-2-13B: hidden_size=5120 (high=640 % 32 ✓; main=4480 % 16 ✓);
# intermediate_size=13824 (down high=1728 % 32 ✓; main=12096 % 16 ✓);
# 40 heads × 128 head_dim = 5120; 40 KV heads (no GQA).
# o_proj_pca=per_head to match rd_ron.resolve_paths (which forces per_head and
# the U-wikitext-512-<short>.bin / R-high-0.125-...-<short>.bin artifacts).

model:
  name: "/home/luofan/models/Llama-2-13b-hf"
  type: "llama"

quantize:
  w_bits: "nvfp4"
  a_bits: "nvfp4"
  high_bits: "mxfp8"
  low_bits: 2
  high_fraction: 0.125
  low_fraction: 0.0
  a_asym: true
  w_asym: false
  k_bits: 16
  v_bits: 16
  k_asym: true
  v_asym: true
  k_groupsize: 128
  v_groupsize: 128
  w_groupsize: -1
  w_clip: true
  percdamp: 0.01
  act_order: false
  sparse_fraction: 0.0
  down_proj_blocksize: 256
  rotate_mode: "resq"
  rotation_granularity: "full_shared"
  o_proj_pca: "per_head"

paths:
  basis: "./rotation/U-wikitext-512-Llama-2-13b-hf.bin"
  rotation: "./rotation/R-high-0.125-low-0.0-sparse-0.0-Llama-2-13b-hf.bin"
  output_dir: "/tmp/promix_ptq_13b_mxfp8_nvfp4"

calibration:
  dataset: "wikitext"
  nsamples: 128
  seqlen: 2048
  seed: 0

eval:
  tasks: []
  batch_size: 8
  num_fewshot: 0
  max_length: 2048
